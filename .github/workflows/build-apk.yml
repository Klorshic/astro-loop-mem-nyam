name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - run: chmod +x gradlew && ./gradlew assembleGameDebug
      - uses: actions/upload-artifact@v4
        with: { name: AstroLoop-VanyaVsMama-apk, path: app/build/outputs/apk/game/debug/*.apk }
